<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#131314" />
<title>Minimalist Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ===== VARIABLES — dark is default, light via [data-theme=light] ===== */
:root{
  --bg:#131314; --s1:#1e1f20; --s2:#282a2c; --s3:#37393b;
  --tx:#e3e3e3; --mu:#c4c7c5; --line:#444746;
  --pr:#a8c7fa; --onpr:#062e6f; --nav:#0842a0; --navtx:#d3e3fd; --fc:#0b3a6b; --fctx:#d3e3fd;
  --y:#ffe600; --lime:#d7ff2e; --b:#2f8bff; --scrim:rgba(0,0,0,.55);
  --font:'Roboto','Cairo',system-ui,sans-serif;
}
html[data-theme=light]{
  --bg:#fdfcfb; --s1:#f1f3f4; --s2:#e6e8ea; --s3:#d3d6d9;
  --tx:#1f1f1f; --mu:#5f6368; --line:#c4c7c5;
  --pr:#0b57d0; --onpr:#fff; --nav:#d3e3fd; --navtx:#041e49; --fc:#d3e3fd; --fctx:#041e49; --scrim:rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.5;padding-bottom:96px;overflow-x:hidden;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{max-width:640px;margin-inline:auto}
.view[hidden],[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
[dir=ltr] .dirflip{transform:scaleX(-1)}

/* ===== Icons (حرف احتياطي + الصورة فوقه) ===== */
.ico{--sz:60px;position:relative;flex:none;width:var(--sz);height:var(--sz);border-radius:calc(var(--sz)*.23);display:grid;place-items:center;
  font-weight:700;font-size:calc(var(--sz)*.45);color:#000;overflow:hidden;background:var(--s2)}
.ico svg{width:100%;height:100%;stroke:none;display:block}

/* ===== HERO (animated phone, inspired by neon-urban game UI) ===== */
.hero{position:relative;height:340px;overflow:hidden;border-radius:0 0 40px 40px;background:#0a0b0c;color:#fff}
.hero>.art{position:absolute;inset:0;width:100%;height:100%;z-index:0;stroke:none;stroke-width:1}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,11,12,.55) 0,transparent 26%,transparent 42%,rgba(10,11,12,.94) 100%);pointer-events:none}
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:18px 16px}
.brand{display:flex;align-items:center;gap:4px;font-weight:500;font-size:20px;letter-spacing:.2px;color:#fff}
.plus{width:22px;height:22px;stroke:var(--lime);stroke-width:3.2;filter:drop-shadow(0 0 6px rgba(215,255,46,.7));animation:plusSpin 3.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes plusSpin{0%,45%{transform:rotate(0) scale(1)}70%{transform:rotate(45deg) scale(1.35)}100%{transform:rotate(90deg) scale(1)}}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);text-align:center;transition:background .2s}
.gear svg{width:22px;height:22px;transition:transform .5s cubic-bezier(.3,0,.2,1)}
.gear:hover svg,.gear:active svg{transform:rotate(90deg)}
.gear:active{background:rgba(255,255,255,.28)}
.hero-body{position:absolute;z-index:3;inset-inline:0;bottom:0;padding:0 18px 18px}
.hero h2{font-size:27px;font-weight:500;line-height:1.3}
.hero p{margin-top:2px;color:#e6e6e6}
.hero-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.stack{display:flex}
.stack .ico{border:2px solid #101214;margin-inline-end:-10px}
.stack .more{--sz:52px;background:var(--lime);color:#111;font-size:16px;font-weight:500}
.explore{background:var(--lime);color:#111;font-weight:500;padding:12px 26px;border-radius:999px;font-size:16px}
/* svg animations */
.art *{transform-box:fill-box}
.fl{animation:flt 4.5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.rg1{transform-origin:center;animation:spin 26s linear infinite}
.rg2{transform-origin:center;animation:spin 38s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{animation:dsh 1.4s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-52}}
.sc{animation:scr 6s linear infinite}
@keyframes scr{to{transform:translateY(-192px)}}
.scan{animation:scn 3.2s linear infinite}
@keyframes scn{from{transform:translateY(-130px)}to{transform:translateY(130px)}}
.gl{opacity:0;animation:gl 4s steps(1) infinite}
.gl.m{animation-delay:.08s}
@keyframes gl{0%,86%,100%{transform:translate(0);opacity:0}88%{transform:translate(-4px,2px);opacity:.95}91%{transform:translate(4px,-2px);opacity:.95}94%{transform:translate(-2px,0);opacity:.8}96%{opacity:0}}
.bdg{transform-origin:center;animation:bdg 3.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes bdg{0%,45%{transform:rotate(0) scale(1)}70%{transform:rotate(45deg) scale(1.22)}100%{transform:rotate(90deg) scale(1)}}
.pl{transform-origin:center;animation:pl 5s ease-in-out infinite}
@keyframes pl{0%,100%{transform:translateY(0) rotate(0) scale(.75);opacity:.25}50%{transform:translateY(-16px) rotate(90deg) scale(1.1);opacity:1}}
.eq{transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.art *,.plus,.bdg{animation:none!important}.gl{opacity:0}}

/* ===== Quick pills ===== */
.pills,.chips{display:flex;gap:10px;overflow-x:auto;padding:18px 16px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar,.chips::-webkit-scrollbar,.car::-webkit-scrollbar,.shots::-webkit-scrollbar,.safe::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:8px;background:var(--s1);padding:13px 20px;border-radius:999px;font-size:16px}
.pill:active{background:var(--s2)}
.fchip{flex:none;border:1px solid var(--line);padding:6px 16px;border-radius:8px;font-size:14px}
.fchip.on{background:var(--fc);border-color:transparent;color:var(--fctx)}

/* ===== Sections + rows ===== */
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 6px;width:100%}
.sh h2{font-size:21px;font-weight:400}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}
.row{display:flex;align-items:center;gap:16px;padding:12px 16px}
.row:active{background:var(--s1)}
.row .info{min-width:0;flex:1}
.row h3{font-size:16px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--mu);font-size:14px}
.badges{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.badge{background:var(--s1);border-radius:8px;padding:1px 10px;font-size:13px;color:var(--mu)}
.soon{opacity:.55;pointer-events:none}

/* ===== Carousels ===== */
.car{display:flex;gap:14px;overflow-x:auto;padding:8px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.c{flex:none;width:96px;scroll-snap-align:start}
.c .ico{--sz:96px}
.c h4{font-size:13px;font-weight:400;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c small{display:block;color:var(--mu);font-size:12px}

/* ===== Bottom nav ===== */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--s1);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:640px;margin-inline:auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
.nav i{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;font-style:normal;transition:background .2s}
.nav a.on{color:var(--tx)}
.nav a.on i{background:var(--nav);color:var(--navtx)}

/* ===== App page ===== */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;padding:10px 8px;background:var(--bg)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--s2)}
.head{display:flex;gap:16px;padding:6px 16px 0;align-items:flex-start}
.head h1{font-size:22px;font-weight:500;line-height:1.3}
.head .dev{color:var(--pr);font-weight:500;font-size:14px}
.head .iap{color:var(--mu);font-size:13px;margin-top:2px}
.stats{display:flex;margin:22px 8px 18px}
.st{flex:1;text-align:center;padding-inline:4px;border-inline-start:1px solid var(--line)}
.st:first-child{border:0}
.st b{display:block;font-size:15px;font-weight:500;direction:ltr}
.st small{color:var(--mu);font-size:12px}
.install{display:block;margin:0 16px;padding:11px;border-radius:999px;background:var(--pr);color:var(--onpr);font-weight:500;font-size:16px;text-align:center}
.install:active{filter:brightness(.9)}
.out{display:block;margin:10px 16px 0;width:calc(100% - 32px);text-align:center;border:1px solid var(--line);border-radius:999px;padding:9px;color:var(--pr);font-weight:500}
.shots{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shot{flex:none;position:relative;height:300px;min-width:140px;border-radius:16px;overflow:hidden;background:var(--s1);scroll-snap-align:start}
.shot img{display:block;height:100%;width:auto}
.about{padding:0 16px;font-size:19px;font-weight:300;line-height:1.6}
.tags{display:flex;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:14px}
.safe{display:flex;gap:12px;overflow-x:auto;padding:8px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.safe div{flex:none;width:200px;border:1px solid var(--line);border-radius:18px;padding:16px;scroll-snap-align:start;font-size:13px;color:var(--mu)}
.safe div b{display:block;color:var(--tx);font-weight:500;font-size:14px;margin:8px 0 4px}
.note{padding:6px 16px;font-size:12px;color:var(--mu)}

/* ===== Search ===== */
.sbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 4px}
.sbar label{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:999px;padding:12px 20px}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}

/* ===== Scrim / drawer / sheet ===== */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.drawer{position:fixed;z-index:50;inset-block:0;inset-inline-end:0;width:min(88vw,370px);background:var(--s1);overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,0,0,1),visibility 0s .3s;padding-bottom:32px}
[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.open,[dir=rtl] .drawer.open{transform:none;visibility:visible;transition-delay:0s}
.dh{display:flex;align-items:center;gap:14px;padding:20px 16px 12px}
.dh .mark{width:52px;height:52px;border-radius:50%;background:#101214;border:2px solid var(--lime);display:grid;place-items:center;flex:none}
.dh .mark svg{stroke:var(--lime);stroke-width:3.2;width:24px;height:24px}
.dh b{font-size:18px;font-weight:500;display:block;line-height:1.2}
.dh small{color:var(--mu)}
.dh .ib{margin-inline-start:auto}
.dg{padding:18px 16px 6px;font-size:13px;font-weight:500;color:var(--pr);letter-spacing:.3px}
.dgs{padding:0 16px 6px;color:var(--mu);font-size:13px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.set span{display:flex;align-items:center;gap:14px}
.sw{width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:inset-inline-start .2s,background .2s}
.sw[aria-checked=true]{background:var(--pr)}
.sw[aria-checked=true]::after{inset-inline-start:24px;background:var(--onpr)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:6px 14px;font-size:14px;text-align:center}
.seg button.on{background:var(--fc);color:var(--fctx);font-weight:500}
.don{display:flex;align-items:center;gap:12px;margin:8px 16px 0;background:var(--s2);border-radius:16px;padding:12px 14px}
.don div{flex:1;min-width:0}
.don b{font-weight:500;font-size:14px;display:block}
.don small{display:block;color:var(--mu);direction:ltr;text-align:start;overflow-wrap:anywhere;font-size:12px}
.cp{flex:none;color:var(--pr);font-weight:500;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);text-align:center}
.lst a{display:flex;align-items:center;gap:14px;padding:11px 16px}
.lst a:active{background:var(--s2)}
.lst .li{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--pr);flex:none}
.lst b{font-weight:500;font-size:14px;display:block;line-height:1.3}
.lst small{display:block;color:var(--mu);font-size:12px}
.soc{display:flex;flex-wrap:wrap;gap:10px;padding:8px 16px 0}
.soc a{width:46px;height:46px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--tx)}
.soc a:active{background:var(--pr);color:var(--onpr)}
.sheet{position:fixed;z-index:50;inset-inline:0;bottom:0;max-width:640px;margin-inline:auto;max-height:82vh;overflow-y:auto;background:var(--s1);border-radius:28px 28px 0 0;
  transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,0,0,1),visibility 0s .3s;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:10px auto 0}
.sheet .sh{padding-top:10px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.kv span{color:var(--mu)}
.kv b{font-weight:500;text-align:end;direction:ltr;unicode-bidi:plaintext}
</style>
</head>
<body>
<div class="shell">

<!-- ================= VIEW: HOME ================= -->
<main class="view" id="vHome">
  <header class="hero">
    <!-- animated looping phone (original artwork, neon-urban game-UI inspired) -->
    <svg class="art" viewBox="0 0 640 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d7ff2e" fill-opacity=".2"/></pattern>
        <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7ff2e" stop-opacity=".26"/><stop offset="1" stop-color="#d7ff2e" stop-opacity="0"/></linearGradient>
        <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7ff2e" stop-opacity="0"/><stop offset=".5" stop-color="#d7ff2e" stop-opacity=".45"/><stop offset="1" stop-color="#d7ff2e" stop-opacity="0"/></linearGradient>
        <clipPath id="scr"><rect x="-54" y="-114" width="108" height="228" rx="20"/></clipPath>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <rect width="640" height="340" fill="#0a0b0c"/>
      <rect width="640" height="340" fill="url(#dots)"/>
      <polygon points="255,-10 455,-10 405,350 195,350" fill="url(#slab)"/>
      <polygon points="255,-10 455,-10 405,350 195,350" fill="none" stroke="#d7ff2e" stroke-opacity=".3" stroke-width="1.5"/>
      <circle class="rg1" cx="320" cy="150" r="128" fill="none" stroke="#d7ff2e" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="6 10"/>
      <circle class="rg2" cx="320" cy="150" r="160" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="40 14 4 14"/>
      <!-- equalizer bars -->
      <g transform="translate(150 230)" id="eqL"></g>
      <g transform="translate(470 230)" id="eqR"></g>
      <!-- caution tape -->
      <line x1="-30" y1="262" x2="670" y2="244" stroke="#000" stroke-width="18"/>
      <line class="dash" x1="-30" y1="262" x2="670" y2="244" stroke="#d7ff2e" stroke-width="18" stroke-dasharray="26 26"/>
      <!-- phone -->
      <g class="fl"><g transform="translate(322 134) rotate(-12) scale(.84)">
        <rect x="-62" y="-122" width="124" height="244" rx="26" fill="#d7ff2e" fill-opacity=".32" filter="url(#glow)"/>
        <rect x="-62" y="-122" width="124" height="244" rx="26" fill="#0d0d10" stroke="#d7ff2e" stroke-width="3"/>
        <rect x="-54" y="-114" width="108" height="228" rx="20" fill="#14151a"/>
        <g clip-path="url(#scr)">
          <g class="sc" id="rows"></g>
          <rect x="-54" y="-114" width="108" height="34" fill="#1c1e24"/>
          <path d="M-40 -97h12M-34 -103v12" stroke="#d7ff2e" stroke-width="3"/>
          <rect x="-16" y="-101" width="44" height="7" rx="3.500" fill="#e3e3e3" opacity=".85"/>
          <rect class="scan" x="-54" y="-14" width="108" height="28" fill="url(#scanG)"/>
        </g>
        <rect x="-16" y="-118" width="32" height="6" rx="3" fill="#000"/>
        <rect class="gl" x="-62" y="-122" width="124" height="244" rx="26" fill="none" stroke="#00e5ff" stroke-width="2"/>
        <rect class="gl m" x="-62" y="-122" width="124" height="244" rx="26" fill="none" stroke="#ff2d95" stroke-width="2"/>
        <g transform="translate(60 -112)"><g class="bdg"><circle r="19" fill="#d7ff2e"/><path d="M-8 0H8M0-8V8" stroke="#000" stroke-width="4" stroke-linecap="round"/></g></g>
      </g></g>
      <!-- floating plus signs / squares -->
      <g id="floaters"></g>
    </svg>

    <div class="top">
      <a class="brand" href="#home" aria-label="Minimalist Plus"><span>Minimalist</span><svg class="plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg></a>
      <button class="gear" id="menuBtn" aria-haspopup="dialog" aria-controls="drawer" data-al="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.650 1.650 0 00.330 1.820l.060.060a2 2 0 010 2.830 2 2 0 01-2.830 0l-.060-.060a1.650 1.650 0 00-1.820-.330 1.650 1.650 0 00-1 1.510V21a2 2 0 01-2 2 2 2 0 01-2-2v-.090A1.650 1.650 0 009 19.400a1.650 1.650 0 00-1.820.330l-.060.060a2 2 0 01-2.830 0 2 2 0 010-2.830l.060-.060a1.650 1.650 0 00.330-1.820 1.650 1.650 0 00-1.510-1H3a2 2 0 01-2-2 2 2 0 012-2h.090A1.650 1.650 0 004.600 9a1.650 1.650 0 00-.330-1.820l-.060-.060a2 2 0 010-2.830 2 2 0 012.830 0l.060.060a1.650 1.650 0 001.820.330H9a1.650 1.650 0 001-1.510V3a2 2 0 012-2 2 2 0 012 2v.090a1.650 1.650 0 001 1.510 1.650 1.650 0 001.820-.330l.060-.060a2 2 0 012.830 0 2 2 0 010 2.830l-.060.060a1.650 1.650 0 00-.330 1.820V9a1.650 1.650 0 001.510 1H21a2 2 0 012 2 2 2 0 01-2 2h-.090a1.650 1.650 0 00-1.510 1z" transform="translate(1 1) scale(.92)"/></svg></button>
    </div>
    <div class="hero-body">
      <h2 data-i="heroTitle"></h2>
      <p data-i="heroSub"></p>
      <div class="hero-row">
        <div class="stack" id="stack"></div>
        <a class="explore" href="#list" data-i="explore"></a>
      </div>
    </div>
  </header>

  <nav class="pills">
    <button class="pill" data-q="new"><svg viewBox="0 0 24 24"><path d="M12 3l2.500 5.500L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.500-.5z"/></svg><span data-i="pNew"></span></button>
    <button class="pill" data-q="cats"><svg viewBox="0 0 24 24"><rect x="3" y="13" width="7" height="7" rx="2"/><circle cx="17" cy="16.500" r="3.500"/><path d="M6.500 3l3.500 7H3z"/></svg><span data-i="pCats"></span></button>
    <button class="pill" data-q="svc"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/></svg><span data-i="pSvc"></span></button>
  </nav>

  <div class="sh" id="list"><h2 data-i="sugg"></h2></div>
  <div id="rows2"></div>
  <div class="sh"><h2 data-i="allApps"></h2></div>
  <div class="car" id="car"></div>
</main>

<!-- ================= VIEW: APP PAGE (template for every app) ================= -->
<main class="view" id="vApp" hidden>
  <div class="bar"><a class="ib" href="#home" data-al="back"><svg class="dirflip" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
  <div class="head"><div id="aIco"></div><div><h1 id="aName"></h1><div class="dev" id="aDev"></div><div class="iap" data-i="noAds"></div></div></div>

  <div class="stats">
    <div class="st"><b id="aVer"></b><small data-i="sVer"></small></div>
    <div class="st"><b id="aSize"></b><small data-i="sSize"></small></div>
    <div class="st"><b id="aAge"></b><small data-i="sAge"></small></div>
  </div>

  <a class="install" id="aOpen" href="#" target="_blank" rel="noopener" data-i="open"></a>
  <button class="out" id="share" data-i="copy"></button>

  <div class="shots" id="shots"></div>

  <button class="sh" id="aboutBtn" aria-haspopup="dialog" aria-controls="sheet"><h2 data-i="about"></h2><span class="round"><svg class="dirflip" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span></button>
  <p class="about" id="aDesc"></p>
  <div class="tags" id="aTags"></div>

  <div class="sh"><h2 data-i="more"></h2></div>
  <div class="car" id="more"></div>

  <div class="sh"><h2 data-i="safety"></h2></div>
  <div class="safe" id="safe"></div>
  <p class="note" data-i="safeNote"></p>
</main>

<!-- ================= VIEW: SEARCH ================= -->
<main class="view" id="vSearch" hidden>
  <div class="sbar"><label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" data-ph="searchPh" data-al="tSearch" /></label></div>
  <div class="chips" id="fchips"></div>
  <div id="sRows"></div>
  <p class="empty" id="empty" data-i="none" hidden></p>
</main>

</div>

<!-- ================= BOTTOM NAV ================= -->
<nav class="nav"><div>
  <a href="#home" data-t="home"><i><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></i><span data-i="tApps"></span></a>
  <a href="#search" data-t="search"><i><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></i><span data-i="tSearch"></span></a>
</div></nav>

<div class="scrim" id="scrim" hidden></div>

<!-- ================= DRAWER (opens from the orange K) ================= -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" data-al="menu">
  <div class="dh">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></span>
    <div><b id="devName"></b><small data-i="dSub"></small></div>
    <button class="ib" id="closeDrawer" data-al="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="dg" data-i="dSet"></div>
  <div class="set"><span><svg viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 019.500 4 8 8 0 1020 14.500z"/></svg><span data-i="dTheme"></span></span>
    <button class="sw" id="themeSw" role="switch" aria-checked="true" data-al="dTheme"></button></div>
  <div class="set"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span data-i="dLang"></span></span>
    <div class="seg"><button data-l="en">EN</button><button data-l="ar">العربية</button></div></div>

  <div class="dg" data-i="dDon"></div>
  <div class="dgs" data-i="dDonSub"></div>
  <div id="don"></div>

  <div class="dg" data-i="dContact"></div>
  <div class="lst" id="contact"></div>
  <div class="soc" id="soc"></div>

  <div class="dg" id="svcHead" data-i="dSvc"></div>
  <div class="dgs" data-i="dSvcSub"></div>
  <div class="lst" id="svc"></div>
</aside>

<!-- ================= SHEET: technical info (opens from the arrow) ================= -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="grab"></div>
  <div class="sh"><h2 data-i="tech"></h2><button class="ib" id="closeSheet" data-al="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="kv"></div>
</div>

<script src="data.js"></script>
<script>
/* ===================== UI TEXT (EN / AR) — defaults; data.js can override ===================== */
var T={
 en:{heroTitle:"Discover {dev} apps",heroSub:"Light, fast tools — no ads",explore:"Explore",pNew:"Newest",pCats:"Categories",pSvc:"Services",
  sugg:"Suggested for you",allApps:"All apps",tApps:"Apps",tSearch:"Search",noAds:"No ads · No in-app purchases",open:"Open app",copy:"Copy link",copied:"Copied ✓",cp:"Copy",
  sVer:"Version",sSize:"Size",sAge:"Age",age:"3+",about:"About this app",more:"More from {dev}",safety:"Data safety",safeNote:"Privacy practices may vary. This information was provided by the developer.",
  searchPh:"Search Minimalist +",all:"All",none:"No matching apps.",back:"Back",close:"Close",menu:"Settings",
  tech:"Technical info",techVer:"Version",techUpd:"Last updated",techSize:"Size",techPlat:"Platform",techReq:"Requires",techStack:"Built with",techLang:"Languages",
  dSub:"Digital services",dSet:"SETTINGS",dTheme:"Dark mode",dLang:"Language",dDon:"SUPPORT US",dDonSub:"Choose a method and copy the details",
  dContact:"CONTACT",dSvc:"MORE ONLINE SERVICES",dSvcSub:"Order directly via Telegram"},
 ar:{heroTitle:"اكتشف تطبيقات {dev}",heroSub:"أدوات خفيفة وسريعة — بدون إعلانات",explore:"استكشف",pNew:"الأحدث",pCats:"التصنيفات",pSvc:"الخدمات",
  sugg:"مقترح لك",allApps:"كل التطبيقات",tApps:"التطبيقات",tSearch:"بحث",noAds:"بدون إعلانات · بدون مشتريات داخل التطبيق",open:"فتح التطبيق",copy:"نسخ الرابط",copied:"تم النسخ ✓",cp:"نسخ",
  sVer:"الإصدار",sSize:"الحجم",sAge:"العمر",age:"3+",about:"لمحة عن هذا التطبيق",more:"المزيد من {dev}",safety:"أمان البيانات",safeNote:"قد تختلف ممارسات الخصوصية. هذه المعلومات مقدَّمة من المطوّر.",
  searchPh:"ابحث في Minimalist +",all:"الكل",none:"لا توجد تطبيقات مطابقة.",back:"رجوع",close:"إغلاق",menu:"الإعدادات",
  tech:"معلومات تقنية",techVer:"الإصدار",techUpd:"آخر تحديث",techSize:"الحجم",techPlat:"المنصّة",techReq:"المتطلبات",techStack:"التقنيات",techLang:"اللغات",
  dSub:"خدمات رقمية متكاملة",dSet:"الإعدادات",dTheme:"الوضع الداكن",dLang:"اللغة",dDon:"ادعمنا",dDonSub:"اختر طريقة وانسخ البيانات",
  dContact:"تواصل معنا",dSvc:"المزيد من خدماتنا",dSvcSub:"اطلب مباشرة عبر تيليغرام"}
};
if(typeof TEXT!=='undefined'){for(var _l in TEXT){T[_l]=T[_l]||{};for(var _k in TEXT[_l])T[_l][_k]=TEXT[_l][_k]}}

/* ===================== HELPERS ===================== */
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var lang='en', theme='dark';
try{lang=localStorage.getItem('mp_lang')||lang;theme=localStorage.getItem('mp_theme')||theme}catch(e){}
function t(k){var s=(T[lang]&&T[lang][k])||T.en[k]||k;return s.replace(/\{dev\}/g,SITE.dev)}
function L(o){return (typeof o==='string')?o:(o[lang]||o.en)}
function catName(k){return CATS[k]?L(CATS[k]):k}
function ico(a,sz){return '<div class="ico" style="--sz:'+(sz||60)+'px">'+a.icon+'</div>'}
function row(a){
  var b=a.soon?'':'<div class="badges"><span class="badge">'+esc(a.size)+'</span><span class="badge">'+esc(t('noAds').split(' · ')[0])+'</span></div>';
  return '<a class="row'+(a.soon?' soon':'')+'" href="#'+a.id+'">'+ico(a,60)+'<div class="info"><h3>'+esc(L(a.name))+'</h3><div class="sub">'+esc(catName(a.cat))+(a.soon?'':' • '+esc(L(a.type)))+'</div>'+b+'</div></a>';
}
function card(a){
  return '<a class="c'+(a.soon?' soon':'')+'" href="#'+a.id+'">'+ico(a,96)+'<h4>'+esc(L(a.name))+'</h4><small>'+esc(catName(a.cat))+'</small></a>';
}
function find(id){return APPS.filter(function(a){return a.id===id&&!a.soon})[0]}
function ip(p){return '<svg viewBox="0 0 24 24"><path d="'+p+'"/></svg>'}
function shotErr(i){var c=i.parentNode,w=c.parentNode;c.remove();if(!w.children.length)w.hidden=true}
function src(u){return /^(https?:|data:)/.test(u)?u:IMG_BASE+u}

/* ===================== HERO ART (generated, loops forever) ===================== */
(function(){
  var cols=['#d7ff2e','#2f8bff','#ff9d00'], r='';
  for(var i=0;i<6;i++){var y=-76+i*64;
    r+='<rect x="-44" y="'+y+'" width="30" height="30" rx="9" fill="'+cols[i%3]+'"/>'+
       '<rect x="-6" y="'+(y+4)+'" width="44" height="7" rx="3.5" fill="#e3e3e3" opacity=".9"/>'+
       '<rect x="-6" y="'+(y+17)+'" width="30" height="6" rx="3" fill="#8a8d94"/>'+
       '<rect x="-44" y="'+(y+42)+'" width="88" height="1.5" fill="#2a2c33"/>';
  }
  $('rows').innerHTML=r;
  var eq='';
  for(var j=0;j<7;j++){var h=26+((j*37)%40);
    eq+='<rect class="eq" x="'+(j*11)+'" y="'+(-h)+'" width="7" height="'+h+'" rx="2" fill="'+(j%2?'#fff':'#d7ff2e')+'" fill-opacity="'+(j%2?.55:.9)+'" style="animation-delay:-'+(j*.17).toFixed(2)+'s"/>';
  }
  $('eqL').innerHTML=eq; $('eqR').innerHTML=eq;
  var pl=[[205,60,0],[455,40,-1.5],[500,150,-3],[190,175,-2.2],[420,215,-.8],[245,20,-3.8]], f='';
  pl.forEach(function(p,i){
    f+='<g transform="translate('+p[0]+' '+p[1]+')"><g class="pl" style="animation-delay:'+p[2]+'s">'+
       (i%3==2?'<rect x="-5" y="-5" width="10" height="10" fill="none" stroke="#fff" stroke-width="2.5"/>':
        '<path d="M-9 0H9M0-9V9" stroke="'+(i%2?'#fff':'#d7ff2e')+'" stroke-width="3.500" stroke-linecap="round"/>')+'</g></g>';
  });
  $('floaters').innerHTML=f;
})();

/* ===================== RENDER ===================== */
var sortMode='', cat='all', cur=null;
function renderHome(){
  var live=APPS.filter(function(a){return !a.soon});
  $('stack').innerHTML=live.slice(0,3).map(function(a){return ico(a,52)}).join('')+(APPS.length>3?'<div class="ico more" style="--sz:52px">+'+(APPS.length-3)+'</div>':'');
  var list=APPS.slice(); if(sortMode==='new')list.reverse();
  $('rows2').innerHTML=list.map(row).join('');
  $('car').innerHTML=APPS.map(card).join('');
}
function renderApp(a){
  cur=a; $('aIco').innerHTML=ico(a,96); $('aName').textContent=L(a.name); $('aDev').textContent=SITE.dev;
  $('aVer').textContent=a.ver; $('aSize').textContent=a.size; $('aAge').textContent=t('age');
  $('aOpen').href=a.url; $('aDesc').textContent=L(a.desc);
  $('aTags').innerHTML=a.tags.map(function(x){return '<span class="tag">'+esc(L(x))+'</span>'}).join('');
  var sh=(a.shots||[]).map(function(u){return '<div class="shot"><img src="'+esc(src(u))+'" alt="" loading="lazy" onerror="shotErr(this)" /></div>'});
  $('shots').innerHTML=sh.join(''); $('shots').hidden=!sh.length;
  $('more').innerHTML=APPS.filter(function(x){return x.id!==a.id}).map(card).join('');
  $('safe').innerHTML=SAFE.map(function(s){var x=s[lang]||s.en;return '<div><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/></svg><b>'+esc(x[0])+'</b>'+esc(x[1])+'</div>'}).join('');
  $('kv').innerHTML=[['techVer',a.ver],['techUpd',a.upd],['techSize',a.size],['techPlat',L(a.plat)],['techReq',L(a.req)],['techStack',a.stack],['techLang',L(a.langs)]]
    .map(function(r){return '<div class="kv"><span>'+esc(t(r[0]))+'</span><b>'+esc(r[1])+'</b></div>'}).join('');
  document.title=L(a.name)+' — Minimalist +';
}
function renderSearch(){
  var s=$('q').value.trim().toLowerCase();
  var r=APPS.filter(function(a){return (cat==='all'||a.cat===cat)&&L(a.name).toLowerCase().indexOf(s)>-1});
  $('sRows').innerHTML=r.map(row).join(''); $('empty').hidden=r.length>0;
}
function renderChips(){
  var keys=['all'].concat(APPS.map(function(a){return a.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
  $('fchips').innerHTML=keys.map(function(c){return '<button class="fchip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c==='all'?t('all'):catName(c))+'</button>'}).join('');
}
function renderDrawer(){
  $('don').innerHTML=DONATE.map(function(d){
    return '<div class="don"><span class="li" style="color:var(--pr)">'+ip(d.path)+'</span><div><b>'+esc(L(d.name))+'</b><small>'+esc(d.value)+'</small></div><button class="cp" data-v="'+esc(d.value)+'">'+esc(t('cp'))+'</button></div>';
  }).join('');
  $('contact').innerHTML=CONTACT.map(function(c){
    var ext=/^https?:/.test(c.h)?' target="_blank" rel="noopener"':'';
    return '<a href="'+esc(c.h)+'"'+ext+'><span class="li">'+ip(c.p)+'</span><div><b>'+esc(L(c.n))+'</b><small dir="ltr" style="text-align:start">'+esc(L(c.v))+'</small></div></a>';
  }).join('');
  $('svc').innerHTML=SERVICES.map(function(s){
    return '<a href="'+esc(SITE.orderUrl)+'" target="_blank" rel="noopener"><span class="li">'+ip(s.p)+'</span><div><b>'+esc(L(s.n))+'</b></div></a>';
  }).join('');
}
function applyText(){
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=t(e.dataset.ph)});
  document.querySelectorAll('[data-al]').forEach(function(e){e.setAttribute('aria-label',t(e.dataset.al))});
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
  $('devName').textContent=SITE.dev;
}
function setLang(l){
  lang=l; try{localStorage.setItem('mp_lang',l)}catch(e){}
  var h=document.documentElement; h.lang=l; h.dir=(l==='ar'?'rtl':'ltr');
  applyText(); renderHome(); renderChips(); renderSearch(); renderDrawer(); if(cur)renderApp(cur); route(true);
}
function setTheme(th){
  theme=th; try{localStorage.setItem('mp_theme',th)}catch(e){}
  document.documentElement.dataset.theme=th;
  $('themeSw').setAttribute('aria-checked',th==='dark');
  document.querySelector('meta[name=theme-color]').content=(th==='dark'?'#131314':'#fdfcfb');
}

/* ===================== DRAWER / SHEET ===================== */
var opener=null;
function openLayer(el,btn){
  closeLayers(true); opener=btn||null; el.classList.add('open'); el.setAttribute('aria-hidden','false');
  $('scrim').hidden=false; document.body.style.overflow='hidden';
  var f=el.querySelector('.ib'); if(f)f.focus();
}
function closeLayers(quiet){
  ['drawer','sheet'].forEach(function(i){$(i).classList.remove('open');$(i).setAttribute('aria-hidden','true')});
  $('scrim').hidden=true; document.body.style.overflow='';
  if(!quiet&&opener){opener.focus();opener=null}
}
$('menuBtn').addEventListener('click',function(){openLayer($('drawer'),this)});
$('aboutBtn').addEventListener('click',function(){openLayer($('sheet'),this)});
$('closeDrawer').addEventListener('click',function(){closeLayers()});
$('closeSheet').addEventListener('click',function(){closeLayers()});
$('scrim').addEventListener('click',function(){closeLayers()});
addEventListener('keydown',function(e){if(e.key==='Escape')closeLayers()});
$('themeSw').addEventListener('click',function(){setTheme(theme==='dark'?'light':'dark')});
document.querySelector('.seg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setLang(b.dataset.l)});
$('don').addEventListener('click',function(e){
  var b=e.target.closest('.cp'); if(!b)return; var old=b.textContent;
  try{navigator.clipboard.writeText(b.dataset.v).then(function(){b.textContent=t('copied');setTimeout(function(){b.textContent=old},1500)})}catch(x){}
});
$('share').addEventListener('click',function(){
  var b=this; try{navigator.clipboard.writeText(location.href).then(function(){b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1500)})}catch(x){}
});
document.querySelector('.pills').addEventListener('click',function(e){
  var b=e.target.closest('.pill'); if(!b)return; var q=b.dataset.q;
  if(q==='cats'){location.hash='search';return}
  if(q==='svc'){openLayer($('drawer'),$('menuBtn')); setTimeout(function(){$('svcHead').scrollIntoView({block:'start'})},60);return}
  sortMode=(sortMode==='new'?'':'new'); renderHome();
});
$('fchips').addEventListener('click',function(e){var b=e.target.closest('.fchip');if(!b)return;cat=b.dataset.c;renderChips();renderSearch()});
$('q').addEventListener('input',renderSearch);

/* ===================== ROUTER (#home  #search  #app-id) ===================== */
function route(keepScroll){
  var h=location.hash.slice(1)||'home', a=find(h), tab='home';
  closeLayers(true);
  ['vHome','vApp','vSearch'].forEach(function(v){$(v).hidden=true});
  if(a){$('vApp').hidden=false;renderApp(a)}
  else if(h==='search'){$('vSearch').hidden=false;tab='search';renderSearch();document.title='Search — Minimalist +'}
  else{$('vHome').hidden=false;document.title='Minimalist +'}
  document.querySelectorAll('.nav a').forEach(function(n){n.classList.toggle('on',n.dataset.t===tab)});
  if(h!=='list'&&!keepScroll)scrollTo(0,0);
}
addEventListener('hashchange',function(){route()});

/* ===================== INIT ===================== */
setTheme(theme); setLang(lang);
</script>
</body>
</html>
